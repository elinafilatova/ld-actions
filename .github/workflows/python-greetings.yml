name: lab-darbs-runner

on:
  push:
    branches: ["main"]
  workflow_dispatch: 

jobs:
  install-pip-deps:
    runs-on: self-hosted
    steps:
      - run: echo "Installing all required dependencies..."
    
      - uses: actions/checkout@v6 
      
      - uses: actions/checkout@v6
        with:
          repository: 'mtararujs/python-greetings'
          path: 'python-greetings'

      - run: python -m venv venv
        working-directory: python-greetings
        
      - run: ./venv/Scripts/python -m pip install -r requirements.txt
        working-directory: python-greetings 
          
  deploy-to-dev:
    runs-on: self-hosted
    needs: install-pip-deps
    steps:
      - uses: ./.github/actions/deploy
        with:
          environment: 'dev'
          port: 7001
    
  tests-on-dev:
    runs-on: self-hosted
    needs: deploy-to-dev
    steps:
      - uses: ./.github/actions/test
        with:
          environment: 'dev'
          port: 7001
    
  deploy-to-stg:
    runs-on: self-hosted
    needs: tests-on-dev
    steps:
      - uses: ./.github/actions/deploy
        with:
          environment: 'stg'
          port: 7002
    
  tests-on-stg:
    runs-on: self-hosted
    needs: deploy-to-stg
    steps:
      - uses: ./.github/actions/test
        with:
          environment: 'stg'
          port: 7002
    
  deploy-to-preprod:
    runs-on: self-hosted
    needs: tests-on-stg
    steps:
      - uses: ./.github/actions/deploy
        with:
          environment: 'preprod'
          port: 7003
    
  tests-on-preprod:
    runs-on: self-hosted
    needs: deploy-to-preprod
    steps:
      - uses: ./.github/actions/test
        with:
          environment: 'preprod'
          port: 7003
    
  deploy-to-prod:
    runs-on: self-hosted
    needs: tests-on-preprod
    steps:
      - uses: ./.github/actions/deploy
        with:
          environment: 'prod'
          port: 7004
    
  tests-on-prod:
    runs-on: self-hosted
    needs: deploy-to-prod
    steps:
      - uses: ./.github/actions/test
        with:
          environment: 'prod'
          port: 7004
