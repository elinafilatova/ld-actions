name: Deployment
description: Deployment

inputs:
  environment:
    required: true
  port:
    required: true

runs:
  using: "composite"
  steps:
    - run: echo "Deploying to ${{ inputs.environment }}..."
      shell: powershell
  
    - uses: actions/checkout@v6 
  
    - uses: actions/checkout@v6
      with:
        repository: 'mtararujs/python-greetings'
        path: 'python-greetings'

    - run: python -m venv venv
      shell: powershell
      working-directory: python-greetings
        
    - run: ./venv/Scripts/python -m pip install -r requirements.txt
      shell: powershell
      working-directory: python-greetings 

    - run: pm2 delete greetings-app-${{ inputs.environment }}  ; if (!$?) {Write-Host "does not exist"} ; exit 0
      shell: powershell
      working-directory: python-greetings

    - run: 
        $env:PORT=${{ inputs.port }} 
        pm2 start app.py --name greetings-app-${{ inputs.environment }} --interpreter ./venv/Scripts/python.exe
      shell: powershell
      working-directory: python-greetings
    
