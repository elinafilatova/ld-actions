name: Test
description: Running tests

inputs:
  environment:
    required: true
  port:
    required: true

runs:
  using: "composite"
  steps:
    - run: echo "Running tests on ${{ inputs.environment }}..."
      shell: powershell

    - uses: actions/checkout@v6

    - uses: actions/checkout@v6
      with:
        repository: 'mtararujs/course-js-api-framework'
        path: 'course-js-api-framework'

    - uses: actions/checkout@v6
      with:
        repository: 'mtararujs/python-greetings'
        path: 'python-greetings'

    - run: python -m venv venv
      shell: powershell
      working-directory: python-greetings
        
    - run: ./venv/Scripts/python -m pip install -r requirements.txt
      shell: powershell
      working-directory: python-greetings 

    - run: pm2 delete greetings-app-${{ inputs.environment }}  ; if (!$?) {Write-Host "does not exist"} ; exit 0
      shell: powershell
      working-directory: python-greetings

    - run: |
        $env:PORT=${{ inputs.port }} 
        pm2 start app.py --name greetings-app-${{ inputs.environment }} --interpreter ./venv/Scripts/python.exe
      shell: powershell
      working-directory: python-greetings

    - run: npm install
      shell: powershell
      working-directory: course-js-api-framework

    - run: npm run greetings greetings_${{ inputs.environment }}
      shell: powershell
      working-directory: course-js-api-framework
